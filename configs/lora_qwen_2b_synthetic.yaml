# ViT encoder (frozen) + Qwen3.5-2B decoder with LoRA + synthetic data augmentation
# Best hyperparameters from Optuna trial #27, with synthetic data mixed into training
# Usage: uv run python main.py finetune-lora --config configs/lora_qwen_2b_synthetic.yaml

run_name: lora-vit-qwen-2b-synthetic
seed: 42
device: cuda
output_dir: outputs

encoder:
  name: vit-base
  pretrained: google/vit-base-patch16-224
  freeze: true
  feature_dim: 768
  checkpoint: outputs/best_T1-2/best
  num_prefix_tokens: 0

decoder:
  name: qwen3.5-2b
  pretrained: Qwen/Qwen3.5-2B

tokenizer:
  type: hf
  max_length: 128

attention:
  enabled: false

lora:
  enabled: true
  r: 4
  alpha: 4
  dropout: 0.1
  target: attention

projection:
  type: qformer
  num_queries: 32
  num_layers: 1
  num_heads: 8
  ffn_dim: 2048
  dropout: 0.1

dataset:
  root: /data/123-1/users/jchen/VizWiz
  train_ann: annotations/train.json
  val_ann: annotations/val.json
  train_img_dir: train
  val_img_dir: val
  ignore_rejected: true
  ignore_precanned: true
  val_split_ratio: 0.1

synthetic_data:
  enabled: true
  root: outputs/synthetic_data
  annotation: annotations/synthetic.json
  image_dir: images

training:
  epochs: 20
  batch_size: 8
  lr: 4.02e-05
  optimizer: adamw
  weight_decay: 0.1
  scheduler: step
  grad_clip: 1.0
  mixed_precision: false
  num_workers: 4
  early_stopping_patience: 5
  gradient_accumulation_steps: 4

inference:
  max_length: 128

wandb:
  enabled: false
  project: c5-image-caption

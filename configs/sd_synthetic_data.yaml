        - shelf
        - carpet
        - desk
        - store shelf
        - coffee table
        - nightstand
        - bookshelf
        - glass table
        - floor

  # --- Computer screens (453 identical "screen with" preds) ---
  - pattern: "A {device} showing {content}"
    caption_pattern: "A {device} showing {content}."
    category: screens
    variables:
      device:
        - computer monitor
        - laptop screen
        - phone screen
        - tablet screen
        - TV screen
        - desktop monitor
        - smartphone
        - iMac screen
        - Chromebook screen

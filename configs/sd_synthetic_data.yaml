# Synthetic training data generation for image captioning
# Prompts target weaknesses identified in Task C analysis
# Usage: uv run python main.py generate-synthetic --config configs/sd_synthetic_data.yaml

run_name: synthetic_data
seed: 42
output_dir: outputs

stable_diffusion:
  model_id: stabilityai/stable-diffusion-3.5-large-turbo
  scheduler: default
  negative_prompt: "watermark, text overlay, clear, artistic, illustration, cartoon, 3d render"
  guidance_scale: 0.0
  num_inference_steps: 4
  images_per_prompt: 50
  width: 1024
  height: 1024
  seed: 42
  dtype: bfloat16

# VizWiz-style augmentation: randomly apply degradation prefixes to prompts
# so synthetic images resemble real VizWiz photos (smartphone, blurry, poorly lit)
vizwiz_style:
  enabled: true
  # fraction of images that get a clean prompt (no degradation prefix)
  clean_fraction: 0.2
  prefixes:
    - "Blurry smartphone photo of"
    - "Out of focus close-up photo of"
    - "Poorly lit smartphone photo of"
    - "Dark and grainy phone camera photo of"
    - "Overexposed flash photo of"
    - "Tilted and slightly blurry photo of"
    - "Extreme close-up smartphone photo of"
    - "Low resolution phone camera picture of"
    - "A finger partially covering the lens in a photo of"
    - "Shaky handheld smartphone photo of"
    - "Dimly lit indoor smartphone photo of"
    - "Motion blurred photo of"
    - "Unfocused amateur photo of"
    - "Hastily taken smartphone snapshot of"
    - "2010s era phone camera photo of"
    - "2004s era cell phone photo of"

# Prompt entries support two formats:
#   Static:   prompt + caption (same text for all images)
#   Template: pattern + caption_pattern + variables (random fills per image)
# Prompt selection is based on quantified weaknesses from 7542-sample eval analysis.
prompts:
  # === TEMPLATES (variable combinations sampled per image) ===

  # --- Products / packaging (HIGHEST PRIORITY: 560 generic "food" preds, only 1 specific) ---
  - pattern: "A {container} of {brand} {product} on a {surface}"
    caption_pattern: "A {container} of {brand} {product} on a {surface}."
    category: product_packaging
    variables:
      container: [box, can, bottle, package, bag, jar, carton, jug, tub, pouch, tin, cup]
      brand:
        - Barilla
        - Coca-Cola
        - Heinz
        - Dr Pepper
        - Ocean Spray
        - Wegmans
        - Jell-O
        - Cheerios
        - Mountain Dew
        - Sprite
        - Betty Crocker
        - Pepsi
        - Gatorade
        - Tropicana
        - Nestle
        - Kraft
        - Campbell's
        - Progresso
        - Folgers
        - Starbucks
        - Lipton
        - Red Bull
        - Quaker
        - Kellogg's
        - Pringles
        - Doritos
        - Fanta
      product:
        - penne pasta
        - soda
        - ketchup
        - chips
        - iced tea
        - chocolate pudding
        - cereal
        - cake mix
        - orange juice
        - cranberry juice
        - rice
        - ravioli
        - soup
        - tomato sauce
        - coffee
        - cookies
        - crackers
        - frozen pizza
        - yogurt
        - energy drink
        - sparkling water
        - salsa
        - mayonnaise
        - mustard
        - peanut butter
        - jam
        - oatmeal
        - hot chocolate mix
        - protein shake
      surface:
        - kitchen counter
        - wooden table
        - store shelf
        - granite countertop
        - desk
        - refrigerator shelf
        - dining table
        - grocery store shelf
        - checkout counter
        - marble counter
        - picnic table
        - glass table

  # --- Food items without generic "food" (counter cookie/chip hallucination) ---
  - pattern: "A {container} of {food_item} on a {surface}"
    caption_pattern: "A {container} of {food_item} on a {surface}."
    category: food_specific
    variables:
      container: [bag, package, bowl, box, plate, cup, tray, wrapper, basket, bucket]
      food_item:
        - potato chips
        - chocolate chip cookies
        - chicken noodle soup
        - trail mix
        - mixed nuts
        - granola bars
        - ramen noodles
        - candy bars
        - protein bars
        - dried fruit
        - microwave popcorn
        - gummy bears
        - pretzels
        - beef jerky
        - rice cakes
        - fruit snacks
        - animal crackers
        - cheese crackers
        - tortilla chips
        - sunflower seeds
      surface:
        - wooden table
        - shelf
        - counter
        - kitchen counter
        - desk
        - picnic table
        - store shelf
        - dining table
        - coffee table

  # --- DVD/media (36 hallucinated titles, 92% of quoted text wrong) ---
  - pattern: "A {media_type} with {cover_desc} on a {surface}"
    caption_pattern: "A {media_type} with {cover_desc} on a {surface}."
    category: media
    variables:
      media_type:

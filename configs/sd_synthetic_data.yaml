    caption: "A can of Coca-Cola on a white table."
    category: product_packaging
  - prompt: "A bottle of Heinz ketchup next to a plate of food"
    caption: "A bottle of Heinz ketchup next to a plate."
    category: product_packaging
  - prompt: "A can of Dr Pepper on a laptop keyboard, red and maroon label visible"
    caption: "A can of Dr Pepper on a laptop keyboard."
